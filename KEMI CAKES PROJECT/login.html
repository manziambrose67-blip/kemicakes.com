<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kemi Cakes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-container">
  <div id="navbar-container"></div>
  
  <div class="login-card">
    <h1 style="color: var(--brown); margin-bottom: 1rem;">Welcome Back</h1>
    <p style="color: #666; margin-bottom: 2rem;">Sign in to your account</p>
    
    <form style="max-width: 350px; margin: 0 auto;">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" placeholder="kemicakes@gmail.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn" style="margin-top: 1rem;">Sign In</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: #666;">
      Don't have an account? <a href="#" style="color: var(--brown);">Contact us</a> to register.
    </p>
  </div>
  
  <div id="footer-container"></div>
  
  <script src="js/script.js"></script>
</body>
</html>
